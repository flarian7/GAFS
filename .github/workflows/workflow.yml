name: PR Workflow

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Say Hello
        run: echo "Workflow chal raha hai"

  say-bye:
    needs : build
    runs-on: ubuntu-latest

    steps:
      - name: Say Bye
        run: echo "Bye bye from workflow"